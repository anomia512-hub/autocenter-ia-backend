services:
  - type: web
    name: autocenter-ia-license-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AUTOCHECK_AUTH_SECRET
        sync: false
      - key: AUTOCHECK_PLAY_VALIDATION
        value: disabled
      - key: AUTOCHECK_DEV_AUTH
        value: false
